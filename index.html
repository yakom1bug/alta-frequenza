<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alta Frequenza">
<title>Alta Frequenza</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1020}
body{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:18px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
main{width:min(430px,100%);text-align:center;padding:28px 20px 22px;border-radius:30px;background:rgba(255,255,255,.075);box-shadow:0 20px 70px rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.08)}
.logo{width:104px;height:104px;margin:0 auto 16px;border-radius:24px;display:grid;place-items:center;background:#fff;color:#111827;font-weight:900;font-size:18px;line-height:1.03;box-shadow:0 10px 30px rgba(0,0,0,.3)}
h1{margin:0;font-size:28px}.live{margin:8px 0 20px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.78}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ef4444;margin-right:7px;box-shadow:0 0 12px #ef4444}
.program{min-height:102px;margin:0 0 18px;padding:17px 13px;border-radius:18px;background:rgba(0,0,0,.24)}
.show{font-size:18px;font-weight:800}.artist{margin-top:8px;font-size:14px;opacity:.92}.title{margin-top:4px;font-size:14px;font-style:italic;opacity:.72}
button{width:100%;border:0;border-radius:18px;padding:19px 18px;font-size:20px;font-weight:800;cursor:pointer;color:#111827;background:#fff;box-shadow:0 10px 25px rgba(0,0,0,.25);-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}#status{min-height:20px;margin:12px 0 8px;font-size:13px;opacity:.7}
audio{width:100%;height:40px;margin-top:3px}.links{margin-top:18px;display:flex;gap:9px}.links a{flex:1;color:#fff;text-decoration:none;padding:11px 7px;border:1px solid rgba(255,255,255,.17);border-radius:13px;font-size:13px}.note{margin-top:16px;font-size:10px;opacity:.3}
</style>
</head>
<body>
<main>
<div class="logo">ALTA<br>FREQUENZA</div>
<h1>Alta Frequenza</h1>
<div class="live"><span class="dot"></span>En direct</div>
<section class="program" aria-live="polite">
<div class="show" id="show">Recherche de l'émission…</div>
<div class="artist" id="artist"></div>
<div class="title" id="title"></div>
</section>
<button id="play" type="button">▶ ÉCOUTER</button>
<div id="status">Appuyez pour écouter</div>
<audio id="audio" controls preload="none"></audio>
<div class="links"><a href="https://www.alta-frequenza.corsica/webradios">🌐 Site</a><a href="https://www.facebook.com/AltaFrequenza">f Facebook</a></div>
<div class="note">Prototype V4</div>
</main>
<script>
const STREAM="https://altafrequenza.ice.infomaniak.ch/altafrequenza-128.mp3";
const audio=document.getElementById("audio"),play=document.getElementById("play"),status=document.getElementById("status");
function parseLive(data){const p=data.trim().split(",");document.getElementById("show").textContent=(p[0]||"Alta Frequenza").trim();document.getElementById("artist").textContent=(p[2]||"").trim();document.getElementById("title").textContent=p.slice(3).join(",").trim();}
async function updateLive(){try{const r=await fetch("live.php?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);const t=await r.text();if(t.trim())parseLive(t);}catch(e){console.log("Live metadata:",e);}}
async function startRadio(){if(!audio.src)audio.src=STREAM;try{await audio.play();play.textContent="⏸ PAUSE";status.textContent="🔴 Alta Frequenza est en direct";}catch(e){status.textContent="Impossible de démarrer — appuyez à nouveau";}}
play.addEventListener("click",async()=>{if(audio.paused)await startRadio();else{audio.pause();play.textContent="▶ ÉCOUTER";status.textContent="Lecture en pause";}});
audio.addEventListener("play",()=>{play.textContent="⏸ PAUSE";status.textContent="🔴 Alta Frequenza est en direct"});
audio.addEventListener("pause",()=>{play.textContent="▶ ÉCOUTER"});
audio.addEventListener("error",()=>{status.textContent="Flux audio indisponible — réessayez"});
updateLive();setInterval(updateLive,10000);
</script>
</body>
</html>
